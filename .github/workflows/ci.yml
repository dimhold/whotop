# The collectors are three different programs wearing one interface: PowerShell
# and WMI on Windows, /proc and ss on Linux, ps and lsof on macOS. Off its own
# platform each one is exercised only against recorded fixtures, so a change
# that parses the fixture correctly and the live output wrongly passes every
# test on the machine it was written on. That is what this matrix is for.
name: CI

on:
  push:
    branches: [main]
    tags-ignore: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # 24 is where it will be run, 22 is the LTS behind it. 20 sits
        # between two covered versions. 18.17, the floor the package
        # declares, is checked by the job below instead: the test runner
        # dropped it, and whotop did not.
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # One job of the nine enforces the coverage floor. Running it everywhere
      # would be nine identical numbers and nine slower jobs.
      - name: Coverage floor
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        run: npm run coverage

      - name: Build
        run: npm run build

      # The tests above read fixtures, which is what makes Linux parsing
      # testable on Windows. It also means a collector can stop working on a
      # platform nobody develops on while every test still passes. This runs
      # the real thing against the runner itself.
      - name: Read this machine for real
        run: node .github/scripts/smoke.mjs

  # `engines` promises Node 18.17, and that promise is about running whotop,
  # not about running its test suite. Vitest 4 requires Node 20, so the floor
  # can no longer be checked by running the tests there — but it can still be
  # checked the way it actually matters: build the package on 18.17 and make
  # it read the machine. Dropping the job instead would have left the number
  # in package.json as something nobody had verified in a year.
  floor:
    name: ${{ matrix.os }} / the package on node 18.17
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      # Built on a Node that can build it. TypeScript 7 ships as ESM with an
      # extensionless bin, which Node 18 refuses to load — a fact about the
      # compiler, not about whotop.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm pack

      # Then the version the package promises, running what somebody would
      # install rather than what the repository builds. The whole point of
      # `engines` is the first of those, and it is the one that was never
      # being checked.
      - uses: actions/setup-node@v7
        with:
          node-version: '18.17'
      - name: Install the tarball and run it
        shell: bash
        run: |
          mkdir floor-check && cd floor-check
          npm init -y > /dev/null
          npm install ../whotop-*.tgz --no-audit --no-fund
          cd ..
          node --version
          node .github/scripts/smoke.mjs floor-check/node_modules/whotop/dist/cli.js

  package:
    name: package contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build

      # dist, README and LICENSE, and nothing else. It has shipped 42 source
      # maps naming a directory it does not contain, so this is checked rather
      # than assumed.
      - name: Nothing unexpected ships
        run: node .github/scripts/check-package.mjs

  picture:
    name: the picture matches the program
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build

      # assets/screen.svg is drawn by the program's own rendering code, so it
      # can be redrawn and compared. A pane that changed height or a footer
      # that gained a key leaves the README showing something the program no
      # longer does, which is exactly what a hand-taken screenshot does wrong.
      - name: Redraw it and compare
        run: |
          node assets/make-screenshot.mjs > /tmp/screen.svg
          diff -u assets/screen.svg /tmp/screen.svg || {
            echo "::error::assets/screen.svg is stale. Run: node assets/make-screenshot.mjs > assets/screen.svg"
            exit 1
          }
